<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Background -->
  <rect width="400" height="300" fill="#eaf6ff"/>
  <!-- Ground -->
  <line x1="0" y1="270" x2="400" y2="270" stroke="#88a4b6" stroke-width="3"/>

  <!-- ===== BICYCLE ===== -->
  <!-- Wheels -->
  <g stroke="#333333" stroke-width="4" fill="none">
    <circle cx="110" cy="230" r="42"/>
    <circle cx="280" cy="230" r="42"/>
    <!-- Spokes -->
    <g stroke-width="1.5">
      <line x1="110" y1="188" x2="110" y2="272"/>
      <line x1="68" y1="230" x2="152" y2="230"/>
      <line x1="80" y1="200" x2="140" y2="260"/>
      <line x1="140" y1="200" x2="80" y2="260"/>
      <line x1="280" y1="188" x2="280" y2="272"/>
      <line x1="238" y1="230" x2="322" y2="230"/>
      <line x1="250" y1="200" x2="310" y2="260"/>
      <line x1="310" y1="200" x2="250" y2="260"/>
    </g>
  </g>
  <!-- Hubs -->
  <circle cx="110" cy="230" r="6" fill="#333"/>
  <circle cx="280" cy="230" r="6" fill="#333"/>

  <!-- Frame -->
  <g stroke="#d6472e" stroke-width="6" stroke-linecap="round" fill="none">
    <line x1="110" y1="230" x2="185" y2="230"/>   <!-- chainstay -->
    <line x1="185" y1="230" x2="200" y2="150"/>   <!-- seat tube -->
    <line x1="110" y1="230" x2="200" y2="150"/>   <!-- down-ish -->
    <line x1="200" y1="150" x2="280" y2="230"/>   <!-- fork-ish -->
    <line x1="280" y1="230" x2="280" y2="130"/>   <!-- steer tube -->
    <line x1="200" y1="150" x2="280" y2="145"/>   <!-- top tube -->
  </g>
  <!-- Handlebars -->
  <line x1="280" y1="130" x2="300" y2="120" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <line x1="280" y1="130" x2="272" y2="115" stroke="#333" stroke-width="5" stroke-linecap="round"/>
  <!-- Seat -->
  <path d="M178,145 q22,-12 44,0 q-22,10 -44,0 Z" fill="#333"/>
  <!-- Crank & pedals -->
  <circle cx="185" cy="230" r="10" fill="none" stroke="#333" stroke-width="3"/>
  <line x1="185" y1="230" x2="155" y2="245" stroke="#333" stroke-width="4"/>
  <line x1="185" y1="230" x2="215" y2="215" stroke="#333" stroke-width="4"/>
  <rect x="145" y="243" width="20" height="6" rx="2" fill="#555"/>
  <rect x="205" y="210" width="20" height="6" rx="2" fill="#555"/>

  <!-- ===== PELICAN ===== -->
  <!-- Legs (to pedals) -->
  <g stroke="#f4a020" stroke-width="5" stroke-linecap="round" fill="none">
    <path d="M200,170 L155,245"/>
    <path d="M205,175 L215,215"/>
  </g>
  <!-- Feet -->
  <path d="M145,245 l-12,4 l12,0 -12,-12" stroke="#f4a020" stroke-width="4" fill="none" stroke-linejoin="round"/>
  <path d="M215,215 l0,-8 l10,8 -10,8" stroke="#f4a020" stroke-width="4" fill="none" stroke-linejoin="round"/>

  <!-- Tail -->
  <path d="M165,165 q-30,-5 -40,-25 q25,10 40,15 Z" fill="#f6e7d4" stroke="#caa070" stroke-width="2"/>
  <!-- Body -->
  <ellipse cx="205" cy="160" rx="48" ry="30" fill="#ffffff" stroke="#b9915e" stroke-width="3"/>
  <!-- Wing -->
  <path d="M190,150 q40,-8 65,18 q-40,18 -65,-18 Z" fill="#f6e7d4" stroke="#b9915e" stroke-width="2.5"/>
  <!-- Wing tip feathers -->
  <g fill="#e7d3b8" stroke="#b9915e" stroke-width="1.5">
    <path d="M250,160 q12,4 20,14 q-15,2 -22,-8 Z"/>
    <path d="M244,166 q10,10 14,22 q-14,-2 -18,-14 Z"/>
  </g>

  <!-- Neck -->
  <path d="M235,145 C250,120 250,95 262,80 C270,70 280,68 288,72"
        fill="none" stroke="#b9915e" stroke-width="20" stroke-linecap="round"/>
  <path d="M235,145 C250,120 250,95 262,80 C270,70 280,68 288,72"
        fill="none" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>

  <!-- Head -->
  <ellipse cx="290" cy="75" rx="16" ry="14" fill="#ffffff" stroke="#b9915e" stroke-width="3"/>
  <!-- Beak top -->
  <path d="M305,70 L360,78 Q365,80 360,84 L306,82 Z" fill="#f4a020" stroke="#d97b12" stroke-width="2"/>
  <!-- Beak pouch -->
  <path d="M305,82 Q340,110 358,86 Q330,90 305,82 Z" fill="#ffcc5c" stroke="#d97b12" stroke-width="2"/>
  <!-- Eye -->
  <circle cx="294" cy="70" r="4" fill="#333"/>
  <!-- Crest tuft -->
  <path d="M282,62 q-4,-10 -14,-10 q6,6 4,14" fill="#e7d3b8" stroke="#b9915e" stroke-width="2"/>

  <!-- ===== SCARF ===== -->
  <path d="M230,135 q-15,8 -35,10 q10,14 30,8 q-8,14 12,18 q8,-14 0,-20 Z"
        fill="#3aa0d0" stroke="#1d6f96" stroke-width="2"/>
</svg>
