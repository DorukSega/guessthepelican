<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     viewBox="0 0 800 500" width="800" height="500" role="img">
  <title>Pelican Riding a Bicycle</title>
  <desc>A cream-colored pelican with a big pink throat pouch rides a coral road bike over grass on a sunny day.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A8DCef"/>
      <stop offset="0.6" stop-color="#CFEFF2"/>
      <stop offset="1" stop-color="#EAF8EA"/>
    </linearGradient>
    <radialGradient id="sunG" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF3B8"/>
      <stop offset="1" stop-color="#FFD86B"/>
    </radialGradient>
    <linearGradient id="grassG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A2C974"/>
      <stop offset="1" stop-color="#6C9A4A"/>
    </linearGradient>
    <linearGradient id="frameG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4756C"/>
      <stop offset="1" stop-color="#B93B38"/>
    </linearGradient>
    <linearGradient id="bodyG" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#FFFCF5"/>
      <stop offset="1" stop-color="#E6DCC8"/>
    </linearGradient>
    <linearGradient id="faceG" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#FBE7BC"/>
      <stop offset="1" stop-color="#DCA85E"/>
    </linearGradient>
    <linearGradient id="beakG" x1="0" y1="0" x2="1" y2="0.3">
      <stop offset="0" stop-color="#F7DFAF"/>
      <stop offset="1" stop-color="#DFA95D"/>
    </linearGradient>
    <linearGradient id="pouchG" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#F8B596"/>
      <stop offset="1" stop-color="#E48B6C"/>
    </linearGradient>
    <linearGradient id="wingG" x1="0" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#F4EDDE"/>
      <stop offset="1" stop-color="#D6CDBB"/>
    </linearGradient>

    <g id="spokes" stroke="#B4BEC2" stroke-width="1.8">
      <line x1="-60" y1="0" x2="60" y2="0"/>
      <line x1="0" y1="-60" x2="0" y2="60"/>
      <line x1="-42.4" y1="-42.4" x2="42.4" y2="42.4"/>
      <line x1="-42.4" y1="42.4" x2="42.4" y2="-42.4"/>
      <line x1="-55.4" y1="-23" x2="55.4" y2="23"/>
      <line x1="-23" y1="-55.4" x2="23" y2="55.4"/>
      <line x1="-23" y1="55.4" x2="23" y2="-55.4"/>
      <line x1="-55.4" y1="23" x2="55.4" y2="-23"/>
    </g>
  </defs>

  <!-- ================= BACKGROUND ================= -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <circle cx="720" cy="90" r="50" fill="#FFDD85" opacity="0.35"/>
  <circle cx="720" cy="90" r="38" fill="url(#sunG)"/>

  <g fill="#FFFFFF" opacity="0.9">
    <ellipse cx="150" cy="98" rx="40" ry="14"/>
    <circle cx="132" cy="92" r="15"/>
    <circle cx="155" cy="84" r="19"/>
    <circle cx="176" cy="92" r="13"/>
    <ellipse cx="300" cy="46" rx="30" ry="11"/>
    <circle cx="290" cy="40" r="11"/>
    <circle cx="308" cy="34" r="14"/>
  </g>

  <path d="M 0 430 C 90 406 200 400 300 418 C 380 432 450 424 540 412
           C 620 402 710 408 800 416 L 800 462 L 0 462 Z" fill="#9FBE78" opacity="0.75"/>
  <rect x="0" y="446" width="800" height="54" fill="url(#grassG)"/>
  <ellipse cx="390" cy="452" rx="200" ry="14" fill="#3F6A36" opacity="0.25"/>

  <!-- grass blades -->
  <g stroke="#5E9445" stroke-width="4" stroke-linecap="round" fill="none">
    <path d="M 30 470 C 26 450 22 438 14 428"/>
    <path d="M 46 470 C 44 452 50 438 60 426"/>
    <path d="M 64 472 C 68 454 76 440 88 430"/>
    <path d="M 676 472 C 674 452 670 440 660 430"/>
    <path d="M 692 470 C 694 452 700 438 710 428"/>
    <path d="M 712 472 C 718 454 726 442 736 434"/>
    <path d="M 752 474 C 756 458 764 446 774 440"/>
  </g>
  <g transform="translate(50,462)">
    <circle r="4.5" fill="#FFFFFF"/><circle cx="12" r="4.5" fill="#FFFFFF"/>
    <circle cx="-12" r="4.5" fill="#FFFFFF"/><circle cx="6" cy="10" r="4.5" fill="#FFFFFF"/>
    <circle cx="-6" cy="10" r="4.5" fill="#FFFFFF"/><circle cx="0" r="5" fill="#F7C94B"/>
  </g>
  <g transform="translate(746,460) scale(0.9)">
    <circle r="4.5" fill="#FFFFFF"/><circle cx="12" r="4.5" fill="#FFFFFF"/>
    <circle cx="-12" r="4.5" fill="#FFFFFF"/><circle cx="6" cy="10" r="4.5" fill="#FFFFFF"/>
    <circle cx="-6" cy="10" r="4.5" fill="#FFFFFF"/><circle cx="0" r="5" fill="#F7C94B"/>
  </g>

  <!-- speed lines -->
  <g fill="none" stroke-linecap="round">
    <line x1="40" y1="106" x2="130" y2="106" stroke="#FFFFFF" stroke-width="7" opacity="0.70"/>
    <line x1="60" y1="150" x2="164" y2="150" stroke="#FFFFFF" stroke-width="7" opacity="0.55"/>
    <line x1="30" y1="200" x2="146" y2="200" stroke="#FFFFFF" stroke-width="7" opacity="0.60"/>
    <line x1="70" y1="250" x2="150" y2="250" stroke="#8ED7E8" stroke-width="7" opacity="0.80"/>
  </g>

  <!-- ================= WHEELS ================= -->
  <g>
    <circle cx="185" cy="370" r="73" fill="none" stroke="#2A3033" stroke-width="13"/>
    <circle cx="185" cy="370" r="64" fill="none" stroke="#DDE3E6" stroke-width="7"/>
    <use href="#spokes" xlink:href="#spokes" x="185" y="370"/>
    <circle cx="185" cy="370" r="12" fill="#586066"/>
    <circle cx="185" cy="370" r="5" fill="#2A3033"/>

    <circle cx="565" cy="370" r="73" fill="none" stroke="#2A3033" stroke-width="13"/>
    <circle cx="565" cy="370" r="64" fill="none" stroke="#DDE3E6" stroke-width="7"/>
    <use href="#spokes" xlink:href="#spokes" x="565" y="370"/>
    <circle cx="565" cy="370" r="12" fill="#586066"/>
    <circle cx="565" cy="370" r="5" fill="#2A3033"/>
  </g>

  <!-- ================= FAR LEG, FAR CRANK, FAR PEDAL ================= -->
  <g>
    <path d="M 296 198 C 295 240 291 280 288 314" stroke="#C58162" stroke-width="17" stroke-linecap="round" fill="none"/>
    <path d="M 288 314 C 287 332 286 344 284 354" stroke="#C58162" stroke-width="11" stroke-linecap="round" fill="none"/>
    <path d="M 335 390 L 275 370" stroke="#494F54" stroke-width="9" stroke-linecap="round"/>
    <rect x="246" y="364" width="60" height="14" rx="5" fill="#242A2D" transform="rotate(-3 276 371)"/>
    <path d="M 276 348 C 288 356 298 360 306 364 L 322 366 L 312 370 L 318 374 L 306 376 L 310 382
             C 296 378 286 368 276 358 Z" fill="#C98868" stroke="#8A6046" stroke-width="2"/>
  </g>

  <!-- ================= FRAME ================= -->
  <g fill="none" stroke-linecap="round">
    <path d="M 503 249 C 519 302 537 341 570 374" stroke="#8E4038" stroke-width="7"/>
    <path d="M 500 246 C 514 298 530 338 565 372" stroke="url(#frameG)" stroke-width="9"/>
    <path d="M 185 370 L 262 228" stroke="url(#frameG)" stroke-width="7"/>
    <path d="M 185 370 L 335 390" stroke="url(#frameG)" stroke-width="9"/>
    <path d="M 335 390 L 265 228" stroke="url(#frameG)" stroke-width="11"/>
    <path d="M 335 390 C 392 358 448 300 500 248" stroke="url(#frameG)" stroke-width="13"/>
    <path d="M 267 224 L 490 220" stroke="url(#frameG)" stroke-width="9"/>
    <path d="M 487 218 L 500 248" stroke="#B93B38" stroke-width="14"/>
    <path d="M 487 218 C 490 206 490 196 491 190" stroke="#9AA3A8" stroke-width="9"/>
    <path d="M 265 228 L 258 208" stroke="#9AA3A8" stroke-width="6"/>
  </g>

  <path d="M 232 208 C 248 198 272 195 292 200 C 302 203 306 209 300 212
           C 280 216 252 216 234 211 Z" fill="#5B3A24" stroke="#3A2517" stroke-width="2"/>

  <path d="M 456 192 C 480 186 508 186 536 192" stroke="#3A4247" stroke-width="8" fill="none" stroke-linecap="round"/>
  <rect x="440" y="186" width="26" height="13" rx="6.5" fill="#22282B" transform="rotate(-3 453 192)"/>
  <rect x="522" y="187" width="26" height="13" rx="6.5" fill="#22282B" transform="rotate(3 535 193)"/>

  <!-- chain, chainring, near crank -->
  <g fill="none">
    <path d="M 335 362 L 185 359 A 11 11 0 0 0 185 381 L 335 418 A 28 28 0 0 0 335 362 Z"
          stroke="#8D9498" stroke-width="5"/>
    <path d="M 335 362 L 185 359 A 11 11 0 0 0 185 381 L 335 418 A 28 28 0 0 0 335 362 Z"
          stroke="#5F6668" stroke-width="5" stroke-dasharray="7 5"/>
  </g>
  <circle cx="335" cy="390" r="26" fill="none" stroke="#4C545A" stroke-width="4" stroke-dasharray="5 4"/>
  <g stroke="#5F676C" stroke-width="4" stroke-linecap="round">
    <line x1="335" y1="390" x2="335" y2="364"/>
    <line x1="335" y1="390" x2="358" y2="403"/>
    <line x1="335" y1="390" x2="312" y2="403"/>
  </g>
  <circle cx="335" cy="390" r="6" fill="#5F676C"/>
  <path d="M 335 390 L 395 400" stroke="#3C4348" stroke-width="11" stroke-linecap="round"/>
  <rect x="364" y="394" width="62" height="15" rx="5" fill="#2B3134" transform="rotate(-2 395 402)"/>

  <!-- ================= FAR WING ================= -->
  <g>
    <path d="M 328 96 C 374 106 432 130 486 160 C 512 175 532 186 546 194
             C 552 200 550 208 542 210 C 530 212 520 205 508 196
             C 470 166 408 136 336 126 Z"
          fill="url(#wingG)" stroke="#4E463F" stroke-width="2.5"/>
    <path d="M 468 158 C 490 174 510 188 524 200" stroke="#C2B9A6" stroke-width="2" fill="none" opacity="0.9"/>
    <path d="M 516 194 C 534 190 550 196 548 206 C 540 214 526 212 514 202 Z" fill="#4A443E"/>
  </g>

  <!-- ================= TAIL ================= -->
  <g fill="#514A44">
    <path d="M 252 156 Q 214 136 190 118 Q 224 146 250 164 Z"/>
    <path d="M 254 170 Q 212 158 184 152 Q 220 164 252 176 Z"/>
    <path d="M 250 182 Q 208 180 182 186 Q 216 186 248 188 Z"/>
  </g>

  <!-- ================= BODY / NECK / HEAD ================= -->
  <path d="M 212 152 C 236 106 282 80 334 68 C 372 58 412 48 440 44
           C 452 40 460 36 470 34 C 498 34 516 44 516 64
           C 516 76 512 88 500 98 C 480 112 456 120 436 130
           C 404 148 370 172 340 192 C 310 210 272 216 244 200
           C 228 190 218 170 212 152 Z"
        fill="url(#bodyG)" stroke="#564C44" stroke-width="3"/>

  <path d="M 242 194 C 268 206 300 204 330 192 C 322 204 302 210 280 210
           C 258 209 246 202 242 194 Z" fill="#E0D6C0" opacity="0.85"/>
  <path d="M 310 84 C 350 70 400 58 448 48" stroke="#FFFBF0" stroke-width="4" fill="none" opacity="0.55"/>

  <!-- crest feathers (wind-blown) -->
  <g fill="#4A443E">
    <path d="M 452 36 C 438 28 426 20 412 8 C 426 22 440 32 456 40 Z"/>
    <path d="M 466 32 C 456 20 448 12 438 4 C 450 16 460 26 472 36 Z"/>
    <path d="M 480 32 C 474 20 470 12 464 4 C 472 14 478 24 486 36 Z"/>
  </g>

  <path d="M 448 54 C 450 34 468 24 490 28 C 514 32 524 48 518 66
           C 512 86 500 98 486 102 C 468 106 452 92 448 74 Z"
        fill="url(#faceG)" stroke="#564C44" stroke-width="2.5"/>

  <g>
    <circle cx="492" cy="56" r="15" fill="#F3E0AC" opacity="0.9"/>
    <circle cx="492" cy="56" r="10" fill="#2C2620"/>
    <circle cx="495" cy="52" r="3.5" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="489" cy="60" r="2" fill="#FFFFFF" opacity="0.45"/>
  </g>

  <!-- upper mandible -->
  <path d="M 512 56 C 566 60 618 74 660 96 L 666 108
           C 616 92 566 82 518 76 Z"
        fill="url(#beakG)" stroke="#8E5C35" stroke-width="2.5"/>
  <path d="M 522 70 C 566 76 610 86 650 100" stroke="#D8A45F" stroke-width="1.8" fill="none" opacity="0.75"/>
  <ellipse cx="534" cy="67" rx="6" ry="3.5" fill="#B8874E" opacity="0.75" transform="rotate(12 534 67)"/>

  <!-- throat pouch -->
  <path d="M 496 92 C 500 118 522 136 552 144 C 588 152 628 140 654 116
           L 662 104 C 610 104 560 96 516 84 C 508 82 500 86 496 92 Z"
        fill="url(#pouchG)" stroke="#BE7050" stroke-width="2.5"/>
  <path d="M 502 102 C 520 124 546 138 582 142 C 618 144 642 128 656 112"
        stroke="#D98A6A" stroke-width="2" fill="none" opacity="0.8"/>
  <path d="M 498 100 C 504 114 510 124 518 134" stroke="#D98A6A" stroke-width="2" fill="none" opacity="0.6"/>

  <!-- ================= NEAR WING ================= -->
  <g>
    <path d="M 330 90 C 372 102 404 126 424 150 C 442 168 456 182 468 194
             C 474 202 470 210 460 212 C 450 212 442 206 436 198
             C 420 180 390 150 360 130 C 350 122 342 120 334 120 Z"
          fill="url(#wingG)" stroke="#4E463F" stroke-width="2.5"/>
    <path d="M 356 116 C 386 142 412 168 434 194" stroke="#C2B9A6" stroke-width="2" fill="none" opacity="0.9"/>
    <path d="M 446 196 C 462 192 478 198 474 208 C 466 214 452 214 444 206 Z" fill="#4A443E"/>
  </g>

  <!-- ================= NEAR LEG + FOOT ================= -->
  <g>
    <path d="M 336 202 C 348 250 358 292 368 322" stroke="#E08A63" stroke-width="17" stroke-linecap="round" fill="none"/>
    <path d="M 368 322 C 374 352 378 372 382 384" stroke="#E08A63" stroke-width="12" stroke-linecap="round" fill="none"/>
    <path d="M 382 380 C 394 388 404 392 412 396 L 430 398 L 418 402 L 424 406 L 412 408 L 416 412
             C 402 408 390 400 380 392 Z"
          fill="#E89A70" stroke="#7E583F" stroke-width="2"/>
  </g>
</svg>
